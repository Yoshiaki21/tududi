services:
  tududi:
    build:                          # ← image: chrisvel/tududi:latest から変更
      context: .                    # Dockerfileがあるディレクトリ
      dockerfile: Dockerfile
    image: registry.gskraft.com/tududi:local  # ← ローカルビルドイメージ名（任意）
    container_name: tududi
    # Requires: cp .env.example .env — see .env.example for all options
    env_file:
      - .env
    volumes:
      - ./tududi_db:/app/db
      - ./uploads:/app/uploads
      - ./backups:/app/backups
    ports:
      - "3002:3002"
    restart: unless-stopped
